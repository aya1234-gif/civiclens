[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "ml", "governance", "api", "config"]

[project]
name = "civiclens"
version = "0.1.0"
description = "AI-powered civic data intelligence platform for Morocco"
requires-python = ">=3.12"
dependencies = [
    # Scraping
    "httpx>=0.27",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=8.3",
    "structlog>=24.2",
    # PDF parsing
    "pdfplumber>=0.11",
    "camelot-py[cv]>=0.11",
    "pytesseract>=0.3.10",
    # Data
    "pandas>=2.2",
    "polars>=0.20",
    "geopandas>=0.14",
    "shapely>=2.0",
    # Validation
    "great-expectations>=0.18",
    # Warehouse
    "dbt-postgres>=1.8",
    # ML
    "scikit-learn>=1.5",
    "pyod>=1.1",
    "xgboost>=2.0",
    "prophet>=1.1",
    "shap>=0.45",
    "networkx>=3.3",
    "mlflow>=2.13",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    # LLM
    "anthropic>=0.28",
    # Governance
    "evidently>=0.4",
    "fairlearn>=0.10",
    # Utilities
    "pyyaml>=6.0",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "voyageai",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "ASYNC"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"
